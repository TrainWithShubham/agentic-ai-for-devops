name: Course checks
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [v2]
permissions:
  contents: read
jobs:
  course:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.10.2'
      - run: uv sync --frozen
      - name: Lint and format
        run: |
          uv run ruff check course_labs scripts tests exercises solutions
          uv run ruff format --check course_labs scripts tests exercises solutions
      - name: Links, schedules and module independence
        run: uv run python scripts/verify_docs.py
      - name: Actual course examples and outcome checks
        run: uv run python scripts/check_course.py
      - name: Completed exercises
        run: uv run python scripts/check_exercise.py all --solution
