name: Course checks
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [v2]
permissions:
  contents: read
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check links and both teaching schedules
        run: python scripts/verify_docs.py
      - name: Check supplied exercise solution
        run: python scripts/check_exercise.py health --solution
