[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "runbookops"
version = "2.0.0"
description = "A two-day Agentic AI for DevOps workshop"
requires-python = ">=3.11,<3.14"
dependencies = [
  "chromadb>=1.0,<2",
  "cryptography>=45",
  "fastapi>=0.115,<1",
  "fastembed>=0.7,<1",
  "fastmcp>=2.12,<3",
  "httpx>=0.28,<1",
  "langgraph>=1,<2",
  "langgraph-checkpoint-sqlite>=3,<4",
  "pydantic>=2.11,<3",
  "pyjwt>=2.10,<3",
  "pypdf>=6,<7",
  "python-docx>=1.2,<2",
  "python-dotenv>=1,<2",
  "python-pptx>=1,<2",
  "rich>=14,<15",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
aws = ["boto3>=1.40", "langgraph-checkpoint-aws>=1", "langgraph-checkpoint-postgres>=3,<4", "psycopg[binary,pool]>=3.2,<4", "opentelemetry-sdk>=1.35", "opentelemetry-exporter-otlp-proto-http>=1.35"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12", "reportlab>=4,<5", "moto[dynamodb]>=5,<6"]

[project.scripts]
runbookops = "runbookops.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["live: explicitly enabled provider integration tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.hatch.build.targets.wheel]
packages = ["src/runbookops"]
